# 250Hz sensor polling with software 125Hz report coalescing in the PMW3610 driver.
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Low latency BLE connection parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Maximize BLE transmission power (+8dBm) for interference resilience
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Reduce queued mouse reports to prevent lag accumulation under PC load
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=5
